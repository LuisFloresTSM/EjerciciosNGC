<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejemplo 2 - La Caja Fuerte (Lógica de Estado)</title>
  <link rel="stylesheet" href="logica.css">
</head>
<body>

  <h1>Caja Fuerte</h1>
  <p>Ingresa el código de 3 dígitos. Los números se irán acumulando.</p>

  <!-- La pantalla de la caja fuerte -->
  <div class="pantalla">
    <!-- Aquí se mostrará el código acumulado -->
    <span id="codigo-acumulado">_ _ _</span>
  </div>

  <!-- Teclado numérico -->
  <div class="teclado">
    <button id="btn-1" class="boton">1</button>
    <button id="btn-2" class="boton">2</button>
    <button id="btn-3" class="boton">3</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
