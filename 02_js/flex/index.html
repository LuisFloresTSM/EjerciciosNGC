<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejemplo 1 - Consola de DJ (Flexbox)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Titulo y descripcion usando solo etiquetas basicas -->
  <h1>Consola de DJ</h1>
  <p>Aprende Flexbox: alineacion horizontal con space-between y centrado vertical con align-items.</p>

  <!-- Contenedor principal con display: flex -->
  <div id="consola" class="consola">
    <button id="btnAnterior" class="boton-control">Anterior</button>
    <button id="btnPlay" class="boton-play">PLAY</button>
    <button id="btnSiguiente" class="boton-control">Siguiente</button>
  </div>

  <p id="mensajeEstado">Estado de musica: En pausa</p>

  <!-- Enlace al archivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
