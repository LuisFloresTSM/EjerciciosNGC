<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>La Varita Mágica (textContent)</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>El Libro de Hechizos</h1>
  <p>Usa los botones para cambiar el texto del pergamino usando `textContent`.</p>

  <!-- Aquí está nuestro elemento con el texto que vamos a modificar -->
  <div id="pergamino" class="pergamino">
    El libro está en blanco...
  </div>

  <div class="botones">
    <!-- Botón para cambiar el texto -->
    <button id="btn-magia">¡Lanzar Hechizo!</button>
    
    <!-- Botón para vaciar el texto -->
    <button id="btn-borrar">Borrar Texto</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
