<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejemplo 3 - Panel de Nave Espacial (Event Listener)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Titulo y descripcion con etiquetas basicas -->
  <h1>Panel de Control de la Nave Espacial</h1>
  <p>Aprende DOM y Eventos: detecta clics con addEventListener y cambia el texto del monitor.</p>

  <!-- Monitor: div vacio con fondo negro pedido en las instrucciones -->
  <div id="monitor" class="monitor"></div>

  <!-- Teclado de mandos con 3 botones -->
  <div class="panel-botones">
    <button id="btnEscudos" class="boton-alerta boton-escudos">Activar Escudos</button>
    <button id="btnMotores" class="boton-alerta boton-motores">Activar Motores</button>
    <button id="btnLaseres" class="boton-alerta boton-laseres">Activar Laseres</button>
  </div>

  <!-- Enlace al archivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
