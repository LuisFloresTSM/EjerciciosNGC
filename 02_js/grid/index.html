<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejemplo 2 - Vitrina de Cartas Magicas (CSS Grid)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Titulo y descripcion con etiquetas basicas -->
  <h1>Vitrina de Cartas Magicas</h1>
  <p>Aprende CSS Grid: define columnas, filas y espacio entre cartas con gap.</p>

  <!-- Contenedor principal con display: grid y 6 divs internos -->
  <div id="vitrina" class="vitrina">
    <div id="carta1" class="carta carta-fuego">
      <p class="titulo-carta">FUEGO</p>
      <p>Poder: 95</p>
    </div>
    <div id="carta2" class="carta carta-hielo">
      <p class="titulo-carta">HIELO</p>
      <p>Poder: 88</p>
    </div>
    <div id="carta3" class="carta carta-rayo">
      <p class="titulo-carta">RAYO</p>
      <p>Poder: 99</p>
    </div>
    <div id="carta4" class="carta carta-veneno">
      <p class="titulo-carta">VENENO</p>
      <p>Poder: 75</p>
    </div>
    <div id="carta5" class="carta carta-luz">
      <p class="titulo-carta">LUZ</p>
      <p>Poder: 90</p>
    </div>
    <div id="carta6" class="carta carta-sombra">
      <p class="titulo-carta">SOMBRA</p>
      <p>Poder: 96</p>
    </div>
  </div>

  <p id="infoCarta">Haz clic en cualquier carta magica para ver su reporte.</p>

  <!-- Enlace al archivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
