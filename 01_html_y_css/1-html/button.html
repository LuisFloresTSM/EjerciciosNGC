<html>
    <head>
        <title>Listas y botones</title>
    </head>
    <body>
        <h2>Nuestras opciones</h2>

        <h3>Lista Desordenada - Viñetas</h3>
        <ul>
            <li>Regadera</li>
            <li>Trapo</li>
            <li>Azúcar</li>
        </ul>

        <h3>Lista Ordenada</h3>
        <ol>
            <li>Ir al supermercado</li>
            <li>Buscar la sección de productos</li>
            <li>Ponerlos en el carrito</li>
        </ol>

        <h2>Botones de Acción</h2>

        <!-- Botón simple -->
        <button>Continuar</button>

        <!-- Botón con propiedades extra (id y atributo disabled) -->
        <button id="boton-peligro" title="Este botón está inactivo temporalmente">
            Cancelar Operación
        </button>
    </body>
</html>
