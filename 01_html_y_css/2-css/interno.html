<html>
    <head>
        <title>Adopción - Interno</title>
        
        <!-- Los estilos viven en el mismo archivo -->
        <style>
            p { 
                font-family: sans-serif; 
                font-size: 18px; 
                color: #333333; 
            }
            #titulo-mascota { 
                color: darkblue; 
                text-align: center; 
            }
            .foto-perfil { 
                border-radius: 15px; 
                border: 4px solid orange; 
                width: 300px; 
            }
            .btn-adoptar { 
                background-color: green; 
                color: white; 
                padding: 10px 20px; 
            }
            .btn-rechazar { 
                background-color: red; 
                color: white; 
                padding: 10px 20px; 
            }
        </style>
    </head>
    <body>
        <h1 id="titulo-mascota">Conoce a Firulais</h1>
        <img class="foto-perfil" src="https://placedog.net/300/200" alt="Foto de Firulais">
        <p>Firulais es un perrito muy juguetón que busca una familia amorosa.</p>
        <button class="btn-adoptar">Adoptar</button>
        <button class="btn-rechazar">Rechazar</button>
    </body>
</html>
