<!DOCTYPE html>
<html>
    <head>
    <title>Sistema de Reseñas</title>
    <link rel="stylesheet" href="estilo.css">
    </head>
    <body>

    <!-- ID: Elemento único -->
    <h1 id="titulo-principal">Registro Cinéfilo</h1>

    <!-- CLASE: Agrupación para cajas -->
    <div class="caja-modulo">
        
        <!-- ETIQUETA: Textos generales -->
        <p>Bienvenida al sistema. Por favor lea las reglas de la comunidad:</p>
        
        <ol>
        <li>Registra todas las películas que veas.</li>
        <li>Escribe reseñas honestas y sin spoilers.</li>
        <li>Respeta los gustos de las demás personas.</li>
        </ol>
        
    </div>

    <!-- CLASE: Reutilización del mismo diseño de caja -->
    <div class="caja-modulo">
        
        <p>Seleccione la operación que desea realizar:</p>
        
        <!-- CLASE: Botones principales -->
        <button class="btn-operacion">Registrar Película</button>
        <button class="btn-operacion">Escribir Reseña</button>
        
        <!-- CLASE: Botón secundario/alerta -->
        <button class="btn-peligro">Eliminar Cuenta</button>
        
    </div>

    </body>
</html>
